services:
  invoice-automation:
    image: invoice-automation:latest
    build: .
    # Env is injected by Komodo (see komodo.toml [[stack]] environment block).
    # Local dev: create a .env and add an `env_file: [.env]` line, and set
    # INVOICE_DATA_DIR=./ so the bind mounts resolve to ./data and ./config.
    # OAuth callback port (8080) intentionally not published — production uses a
    # pre-consented token.json copied to the host config mount. Re-add a
    # `ports: ["8080:8080"]` line temporarily only if an on-host re-consent is ever needed.
    volumes:
      - ${INVOICE_DATA_DIR:-/mnt/shared_configs/invoice-automation}/data:/app/data
      - ${INVOICE_DATA_DIR:-/mnt/shared_configs/invoice-automation}/config:/app/config
    restart: always
